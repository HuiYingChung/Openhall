name = "openhall-token-exchange"
main = "worker/token-exchange.ts"
compatibility_date = "2024-05-31"

# ─── Production ──────────────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS to your hosted app origin before deploying.
# Replace the placeholder with the real origin once you know it.
#
# Deploy steps (ask Hui to run these):
#   1.  npx wrangler login          — authenticate to Cloudflare
#   2.  npx wrangler deploy         — deploy to workers.dev subdomain
#   3.  Copy the worker URL shown, paste into app Settings → Token Worker URL
#
# The worker runs in the Cloudflare Free tier (100k requests/day, zero cost).
# ─────────────────────────────────────────────────────────────────────────────

[vars]
# ALLOWED_ORIGINS = "https://your-openhall.vercel.app"
# Leave blank (or comment out) during development to allow all origins.
ALLOWED_ORIGINS = ""
