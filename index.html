<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openhall — AI 3D Gallery</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Display face for the tool UI only (wordmark + headings). Exported
         galleries never load webfonts — they fall back to system serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
    <!-- Hosted deployment only (deploy/vercel-ph): Vercel Web Analytics —
         cookieless, anonymized visit counts. Served same-origin, so the
         strict CSP (script-src 'self') already covers it. 404s harmlessly
         in local dev where the /_vercel route doesn't exist. -->
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
